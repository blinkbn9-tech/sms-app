<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro SMS App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#007AFF">
    <link rel="manifest" href="manifest.json">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', 'Cool Jazz', 'Roboto', sans-serif !important; font-size: 13px; }
        :root { --bg-primary: #ffffff; --bg-secondary: #f5f5f5; --bg-tertiary: #e5e5ea; --text-primary: #000000; --text-secondary: #666666; --border-color: #eeeeee; --bubble-received: #e9e9eb; --accent: #007AFF; --danger: #FF3B30; }
        body.dark-mode { --bg-primary: #1c1c1e; --bg-secondary: #000000; --bg-tertiary: #2c2c2e; --text-primary: #ffffff; --text-secondary: #98989f; --border-color: #38383a; --bubble-received: #2c2c2e; }
        html, body { height: 100%; overscroll-behavior: none; overflow-x: hidden; }
        body { background: var(--bg-secondary); color: var(--text-primary); max-width: 480px; margin: 0 auto; height: 100vh; overflow: hidden; }
        .app-container { position: relative; height: 100vh; width: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; }
        .main-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: var(--bg-primary); padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .header-content { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; position: relative; }
        .header-title { font-size: 18px; font-weight: 700; }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .icon-btn { font-size: 16px; cursor: pointer; background: none; border: none; color: var(--accent); padding: 4px; }
        .menu-dropdown { position: absolute; top: 40px; right: 0; background: var(--bg-primary); border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 50; width: 200px; border: 1px solid var(--border-color); display: none; }
        .menu-dropdown.show { display: block; }
        .menu-item { padding: 12px 14px; font-size: 13px; color: var(--text-primary); cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .menu-item:last-child { border-bottom: none; }
        .search-bar { max-height: 0; overflow: hidden; transition: max-height 0.3s; }
        .search-bar.active { max-height: 40px; margin-bottom: 12px; }
        .search-bar input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); outline: none; font-size: 13px; }
        .unread-banner { background: var(--bg-tertiary); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
        .unread-count { font-weight: 700; color: var(--accent); font-size: 13px; }
        .view-button { background: var(--accent); color: white; border: none; padding: 5px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; }
        .messages-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-primary); padding-bottom: 70px; }
        .contacts-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-primary); padding-bottom: 70px; display: none; }
        body.contacts-active .messages-container { display: none; }
        body.contacts-active .contacts-container { display: block; }
        body.contacts-active .fab { display: none; }
        body.contacts-active .unread-banner { display: none; }
        .contact-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .contact-info { margin-left: 12px; }
        .contact-name { font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .contact-phone { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .message-wrapper { position: relative; overflow: hidden; border-bottom: 1px solid var(--border-color); }
        .delete-bg { position: absolute; top: 0; right: 0; width: 100%; height: 100%; background: var(--danger); display: flex; align-items: center; justify-content: flex-end; padding-right: 16px; color: white; font-weight: 600; z-index: 1; font-size: 13px; }
        .mark-read-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--accent); display: flex; align-items: center; justify-content: flex-start; padding-left: 16px; color: white; font-size: 16px; z-index: 1; }
        .message-item { display: flex; padding: 12px 16px; cursor: pointer; background: var(--bg-primary); position: relative; z-index: 2; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none !important; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
        
        .avatar { width: 42px; height: 42px; border-radius: 50%; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; font-size: 16px; flex-shrink: 0; }
        .bg-personal { background: #545458; color: #ffffff; }
        body.dark-mode .bg-personal { background: #3a3a3c; }
        .avatar svg { width: 60%; height: 60%; fill: currentColor; }

        .message-content { flex: 1; overflow: hidden; }
        .message-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .sender-name { font-weight: 600; font-size: 14px; color: var(--text-primary); display: flex; align-items: center; }
        .timestamp { font-size: 10px; color: var(--text-secondary); }
        .message-preview { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge { align-self: center; background: var(--accent); color: white; font-size: 10px; font-weight: 600; border-radius: 8px; padding: 2px 6px; margin-left: 8px; }
        .fab { position: absolute; bottom: 70px; right: 16px; width: 48px; height: 48px; background: var(--accent); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 5; border: none; }
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 55px; background: var(--bg-primary); border-top: 1px solid var(--border-color); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
        .nav-item span:last-child { font-size: 11px; }
        .nav-badge { position: absolute; top: 5px; right: 25%; background: var(--danger); color: white; font-size: 9px; border-radius: 8px; padding: 2px 5px; display: none; }
        
        .chat-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-secondary); z-index: 10; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s; }
        .chat-view.active { transform: translateX(0); }
        .chat-header { display: flex; align-items: center; padding: 12px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 1px solid var(--border-color); background: var(--bg-primary); flex-shrink: 0; }
        .back-btn { font-size: 18px; color: var(--accent); cursor: pointer; margin-right: 12px; background: none; border: none; }
        .chat-avatar { width: 32px; height: 32px; border-radius: 50%; margin-right: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; flex-shrink: 0; }
        .chat-title { font-weight: 600; font-size: 15px; color: var(--text-primary); flex: 1; margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-body { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-secondary); min-height: 0; }
        .chat-bubble { max-width: 75%; padding: 8px 12px; border-radius: 16px; font-size: 13px; line-height: 1.4; color: var(--text-primary); word-wrap: break-word; }
        .chat-bubble.received { background: var(--bubble-received); align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-bubble.sent { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .typing-indicator { display: flex; gap: 4px; align-items: center; background: var(--bubble-received); padding: 12px; border-radius: 16px; align-self: flex-start; }
        .typing-indicator span { width: 7px; height: 7px; background: var(--text-secondary); border-radius: 50%; animation: typingBounce 1s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
        .chat-input-area { display: flex; align-items: center; padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); background: var(--bg-primary); border-top: 1px solid var(--border-color); gap: 8px; flex-shrink: 0; }
        .chat-input-area input { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; padding: 8px 12px; font-size: 13px; outline: none; color: var(--text-primary); }
        .chat-meta { font-size: 9px; color: var(--text-secondary); margin-top: 3px; display: flex; align-items: center; gap: 3px; }
        .chat-bubble.sent .chat-meta { justify-content: flex-end; color: rgba(255,255,255,0.8); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .compose-sheet { width: 100%; max-width: 480px; background: var(--bg-primary); border-radius: 16px 16px 0 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; }
        .compose-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .compose-cancel { color: var(--text-secondary); cursor: pointer; font-size: 13px; }
        .compose-title { font-weight: 700; font-size: 15px; color: var(--text-primary); }
        .compose-send { color: var(--accent); font-weight: 600; cursor: pointer; font-size: 13px; }
        .compose-body input, .compose-body textarea { width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 12px; color: var(--text-primary); outline: none; font-size: 13px; resize: none; }
        .compose-body input { margin-bottom: 0; height: 40px; }
        .compose-body textarea { height: 100px; margin-top: 12px; }
        .recycle-item { display: flex; align-items: center; padding: 12px; background: var(--bg-secondary); border-radius: 8px; margin-bottom: 8px; }
        .recycle-info { flex: 1; margin-left: 8px; }
        .restore-btn { background: var(--accent); color: white; border: none; padding: 5px 10px; border-radius: 12px; font-size: 11px; }

        .context-menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 300; display: none; align-items: center; justify-content: center; }
        .context-menu-overlay.active { display: flex; }
        .context-menu { background: var(--bg-primary); width: 220px; border-radius: 12px; overflow: hidden; }
        .context-item { padding: 12px; text-align: center; border-bottom: 1px solid var(--border-color); color: var(--text-primary); cursor: pointer; font-size: 13px; }
        .context-item:last-child { border-bottom: none; }
        .context-item.danger { color: var(--danger); }
        .context-item.cancel { font-weight: 600; }

        .bg-green { background: #4CAF50; } .bg-blue { background: #2196F3; } .bg-purple { background: #9C27B0; } .bg-orange { background: #FF9800; } .bg-red { background: #FF5722; } .bg-grey { background: #607D8B; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="main-view">
            <div class="header">
                <div class="header-content">
                    <div class="header-title" id="viewTitle">Messages</div>
                    <div class="header-actions">
                        <button class="icon-btn" id="searchToggle">🔍</button>
                        <button class="icon-btn" id="menuToggle">⋮</button>
                    </div>
                    <div class="menu-dropdown" id="menuDropdown">
                        <div class="menu-item" id="menuMarkAllRead">✉️ Mark all as read</div>
                        <div class="menu-item" id="menuStarred">⭐ Starred messages</div>
                        <div class="menu-item" id="menuRecycleBin">🗑️ Recycle bin</div>
                        <div class="menu-item" id="menuSettings">⚙️ Settings (Dark Mode)</div>
                    </div>
                </div>
                <div class="search-bar" id="searchBar">
                    <input type="text" id="searchInput" placeholder="Search messages...">
                </div>
                <div class="unread-banner">
                    <div><span class="unread-count" id="totalUnread">0</span> unread messages</div>
                    <button class="view-button" id="viewUnreadBtn">View</button>
                </div>
            </div>
            <div class="messages-container" id="messagesList"></div>
            <div class="contacts-container" id="contactsList"></div>
            <button class="fab" id="newMessageBtn">✏️</button>
            <div class="bottom-nav">
                <div class="nav-item active" data-view="messages"><span class="nav-icon">💬</span><span>Conversations</span></div>
                <div class="nav-item" data-view="contacts"><span class="nav-icon">📒</span><span>Contacts</span></div>
                <div class="nav-badge" id="navBadge">0</div>
            </div>
        </div>

        <div class="chat-view" id="chatView">
            <div class="chat-header">
                <button class="back-btn" id="backBtn">←</button>
                <div class="chat-avatar bg-grey" id="chatAvatar"></div>
                <div class="chat-title" id="chatTitle"></div>
                <button class="icon-btn" id="deleteChatBtn" onclick="deleteCurrentChat()" style="color: var(--danger); font-size: 16px;">🗑️</button>
            </div>
            <div class="chat-body" id="chatBody"></div>
            <div class="chat-input-area" id="chatInputArea">
                <span style="font-size: 18px; color: var(--accent); cursor: pointer;">➕</span>
                <input type="text" id="messageInput" placeholder="Text Message">
                <button class="icon-btn" id="sendBtn" style="font-size: 18px;">➤</button>
            </div>
        </div>

        <div class="modal-overlay" id="composeModal">
            <div class="compose-sheet">
                <div class="compose-header">
                    <span class="compose-cancel" id="composeCancel">Cancel</span>
                    <span class="compose-title">New Message</span>
                    <span class="compose-send" id="composeSend">Send</span>
                </div>
                <div class="compose-body">
                    <input type="text" id="composeSender" placeholder="Sender Name (e.g., MPESA)">
                    <textarea id="composeText" placeholder="Message content..."></textarea>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="recycleBinModal">
            <div class="compose-sheet" style="height: 80vh;">
                <div class="compose-header">
                    <span class="compose-cancel" id="closeRecycleBin">Close</span>
                    <span class="compose-title">Recycle Bin</span>
                    <span class="compose-send" id="emptyRecycleBinBtn" style="color: var(--danger);">Empty</span>
                </div>
                <div class="compose-body" id="recycleBinList" style="overflow-y: auto; padding-bottom: 20px;"></div>
            </div>
        </div>

        <div class="context-menu-overlay" id="contextMenuOverlay">
            <div class="context-menu" id="contextMenu">
                <div class="context-item" id="ctxMarkRead">Mark as Read</div>
                <div class="context-item" id="ctxPin">Pin to Top</div>
                <div class="context-item danger" id="ctxDelete">Delete</div>
                <div class="context-item cancel" id="ctxCancel">Cancel</div>
            </div>
        </div>
    </div>

    <script>
        const personIconSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
        const providerData = {
            "MPESA": { color: "bg-green", initial: "M" },
            "Safaricom": { color: "bg-blue", initial: "S" },
            "Voice Mail": { color: "bg-purple", initial: "V" },
            "Airtel": { color: "bg-orange", initial: "A" },
            "AirtelAlert": { color: "bg-red", initial: "A" }
        };

        function getFormattedDate(date = new Date()) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffDays = Math.round((today - target) / 86400000);
            if (diffDays === 0) return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (diffDays === 1) return "Yesterday";
            if (diffDays > 1 && diffDays < 7) return date.toLocaleDateString([], { weekday: 'short' });
            return date.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
        }
        const minsAgo = (m) => new Date(Date.now() - m * 60000);
        const daysAgo = (d) => new Date(Date.now() - d * 86400000);
        const defaultMessages = [
            { id: 1, name: "MPESA", phone: "+254 722 000 000", color: "bg-green", initial: "M", time: getFormattedDate(minsAgo(15)), preview: "You have received Ksh 1,500 from JOHN DOE.", unread: 3, pinned: false, allowReply: false, isContactOnly: false, history: [{ text: "You have received Ksh 1,500 from JOHN DOE. New balance is 3,450.", type: "received", time: getFormattedDate(minsAgo(15)) }] },
            { id: 2, name: "Safaricom", phone: "+254 720 000 000", color: "bg-blue", initial: "S", time: getFormattedDate(minsAgo(120)), preview: "Your data balance is 2.5GB.", unread: 8, pinned: false, allowReply: false, isContactOnly: false, history: [{ text: "Your data balance is 2.5GB. Expires on 28/08/2026.", type: "received", time: getFormattedDate(minsAgo(120)) }] },
            { id: 3, name: "Voice Mail", phone: "+254 711 000 000", color: "bg-purple", initial: "V", time: getFormattedDate(daysAgo(1)), preview: "You have 8 new voice messages.", unread: 8, pinned: false, allowReply: false, isContactOnly: false, history: [{ text: "You have 8 new voice messages. Call 111 to listen.", type: "received", time: getFormattedDate(daysAgo(1)) }] },
            { id: 4, name: "Airtel", phone: "+254 730 000 000", color: "bg-orange", initial: "A", time: getFormattedDate(daysAgo(3)), preview: "Your Airtel data balance is 1.2GB.", unread: 21, pinned: false, allowReply: false, isContactOnly: false, history: [{ text: "Your Airtel data balance is 1.2GB.", type: "received", time: getFormattedDate(daysAgo(3)) }] },
            { id: 5, name: "AirtelAlert", phone: "+254 730 111 111", color: "bg-red", initial: "A", time: getFormattedDate(daysAgo(10)), preview: "Dear customer, your account balance is Ksh 45.", unread: 12, pinned: false, allowReply: false, isContactOnly: false, history: [{ text: "Dear customer, your account balance is Ksh 45.", type: "received", time: getFormattedDate(daysAgo(10)) }] },
            { id: 6, name: "SAFARICOM", phone: "+254 700 000 000", color: "bg-grey", initial: "S", time: getFormattedDate(daysAgo(45)), preview: "Tuma Pesa: You have received Ksh 2,000.", unread: 0, pinned: false, allowReply: true, isContactOnly: false, history: [{ text: "Tuma Pesa: You have received Ksh 2,000.", type: "received", time: getFormattedDate(daysAgo(45)) }] }
        ];
        const messagesList = document.getElementById('messagesList');
        const chatView = document.getElementById('chatView');
        const totalUnreadEl = document.getElementById('totalUnread');
        const navBadgeEl = document.getElementById('navBadge');
        const menuDropdown = document.getElementById('menuDropdown');
        let activeChatId = null, contextMenuTargetId = null, showingUnreadOnly = false, showingStarredOnly = false;
        function saveMessages() { localStorage.setItem('sms_app_pro', JSON.stringify(messagesData)); }
        function saveDeletedMessages() { localStorage.setItem('sms_app_deleted', JSON.stringify(deletedMessagesData)); }
        
        function loadMessages() {
            if (localStorage.getItem('sms_app_v42') !== 'true') {
                localStorage.removeItem('sms_app_pro');
                localStorage.removeItem('sms_app_deleted');
                localStorage.setItem('sms_app_v42', 'true');
            }
            const saved = localStorage.getItem('sms_app_pro');
            const noReplyNames = Object.keys(providerData);
            if (saved) {
                return JSON.parse(saved).map(msg => {
                    let allowReply = msg.allowReply !== undefined ? msg.allowReply : true;
                    if (noReplyNames.includes(msg.name)) allowReply = false;
                    let isContactOnly = msg.isContactOnly !== undefined ? msg.isContactOnly : false;
                    if (msg.history && msg.history.length > 0) isContactOnly = false; // Fix for old data
                    return { ...msg, pinned: msg.pinned || false, phone: msg.phone || "Unknown", allowReply, isContactOnly, history: msg.history || [{ text: msg.preview, type: "received", time: msg.time }] };
                });
            }
            return [...defaultMessages];
        }
        function loadDeletedMessages() { return JSON.parse(localStorage.getItem('sms_app_deleted')) || []; }
        let messagesData = loadMessages();
        let deletedMessagesData = loadDeletedMessages();

        document.getElementById('menuToggle').addEventListener('click', (e) => { e.stopPropagation(); menuDropdown.classList.toggle('show'); });
        document.addEventListener('click', (e) => { if (!menuDropdown.contains(e.target) && e.target.id !== 'menuToggle') menuDropdown.classList.remove('show'); });
        document.getElementById('menuMarkAllRead').addEventListener('click', () => { messagesData.forEach(msg => msg.unread = 0); saveMessages(); renderMessages(); menuDropdown.classList.remove('show'); });
        document.getElementById('menuStarred').addEventListener('click', () => { showingStarredOnly = !showingStarredOnly; document.getElementById('viewTitle').textContent = showingStarredOnly ? "Starred" : "Messages"; renderMessages(); menuDropdown.classList.remove('show'); });
        document.getElementById('menuSettings').addEventListener('click', () => { document.body.classList.toggle('dark-mode'); localStorage.setItem('dark', document.body.classList.contains('dark-mode')); menuDropdown.classList.remove('show'); });
        if(localStorage.getItem('dark') === 'true') document.body.classList.add('dark-mode');
        
        const recycleBinModal = document.getElementById('recycleBinModal');
        document.getElementById('menuRecycleBin').addEventListener('click', () => { menuDropdown.classList.remove('show'); renderRecycleBin(); recycleBinModal.classList.add('active'); });
        document.getElementById('closeRecycleBin').addEventListener('click', () => recycleBinModal.classList.remove('active'));
        document.getElementById('emptyRecycleBinBtn').addEventListener('click', () => { deletedMessagesData = []; saveDeletedMessages(); renderRecycleBin(); });
        function renderRecycleBin() { const list = document.getElementById('recycleBinList'); if (deletedMessagesData.length === 0) { list.innerHTML = `<p style="text-align:center; color:var(--text-secondary); padding:40px; font-size:13px;">Recycle bin is empty.</p>`; return; } list.innerHTML = deletedMessagesData.map(msg => `<div class="recycle-item"><div class="avatar ${msg.color}">${msg.color === 'bg-personal' ? personIconSVG : msg.initial}</div><div class="recycle-info"><div class="contact-name">${msg.name}</div><div class="contact-phone" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${msg.preview}</div></div><button class="restore-btn" onclick="restoreMessage(${msg.id})">Restore</button></div>`).join(''); }
        function restoreMessage(id) { const msg = deletedMessagesData.find(m => m.id === id); messagesData.unshift(msg); deletedMessagesData = deletedMessagesData.filter(m => m.id !== id); saveMessages(); saveDeletedMessages(); renderRecycleBin(); renderMessages(); }

        const viewUnreadBtn = document.getElementById('viewUnreadBtn');
        viewUnreadBtn.addEventListener('click', () => { showingUnreadOnly = !showingUnreadOnly; viewUnreadBtn.textContent = showingUnreadOnly ? "Show All" : "View"; renderMessages(); });

        function renderMessages(filterText = "") {
            messagesData.sort((a, b) => { if (a.pinned !== b.pinned) return b.pinned - a.pinned; if ((a.unread > 0) !== (b.unread > 0)) return (b.unread > 0) - (a.unread > 0); return 0; });
            // FILTER OUT CONTACTS THAT HAVE NO MESSAGES YET
            let baseData = messagesData.filter(m => !m.isContactOnly);
            if (showingUnreadOnly) baseData = baseData.filter(msg => msg.unread > 0);
            if (showingStarredOnly) baseData = baseData.filter(msg => msg.pinned);
            const filteredData = baseData.filter(msg => msg.name.toLowerCase().includes(filterText.toLowerCase()) || msg.preview.toLowerCase().includes(filterText.toLowerCase()));
            if (filteredData.length === 0) { messagesList.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-secondary); font-size:13px;">No messages</div>`; updateUnread(); return; }
            let html = '';
            filteredData.forEach(msg => {
                const avatarContent = msg.color === 'bg-personal' ? personIconSVG : msg.initial;
                html += `<div class="message-wrapper ${msg.pinned ? 'pinned' : ''}" data-id="${msg.id}"><div class="delete-bg">Delete</div><div class="mark-read-bg">✓</div><div class="message-item"><div class="avatar ${msg.color}">${avatarContent}</div><div class="message-content"><div class="message-header"><div class="sender-name">${msg.pinned ? '📌 ' : ''}${msg.name}</div><div class="timestamp">${msg.time}</div></div><div class="message-preview">${msg.preview}</div></div>${msg.unread > 0 ? `<div class="unread-badge">${msg.unread}</div>` : ''}</div></div>`;
            });
            messagesList.innerHTML = html;
            setupMessageInteractions();
            updateUnread();
        }
        function updateUnread() { const total = messagesData.filter(m => !m.isContactOnly).reduce((s, m) => s + m.unread, 0); totalUnreadEl.textContent = total; navBadgeEl.style.display = total > 0 ? 'block' : 'none'; navBadgeEl.textContent = total; }

        function setupMessageInteractions() {
            document.querySelectorAll('.message-wrapper').forEach(wrapper => {
                const item = wrapper.querySelector('.message-item');
                let startX = 0, startY = 0, currentX = 0, isDragging = false, pressTimer = null, hasLongPressed = false, hasMoved = false;
                const startInteraction = (x, y) => { hasLongPressed = false; hasMoved = false; startX = x; startY = y; isDragging = true; item.style.transition = 'none'; pressTimer = setTimeout(() => { hasLongPressed = true; isDragging = false; const id = parseInt(wrapper.dataset.id); if (navigator.vibrate) navigator.vibrate(30); item.style.transition = 'opacity 0.3s, transform 0.3s'; item.style.opacity = '0'; item.style.transform = 'translateX(-100%)'; setTimeout(() => { deletedMessagesData.unshift(messagesData.find(m => m.id === id)); messagesData = messagesData.filter(msg => msg.id !== id); saveMessages(); saveDeletedMessages(); renderMessages(); }, 300); }, 500); };
                const handleMove = (x, y) => { if (!isDragging) return; currentX = x - startX; const diffY = Math.abs(y - startY); if (Math.abs(currentX) > 15 || diffY > 15) { if (!hasLongPressed) { clearTimeout(pressTimer); hasMoved = true; } } if (currentX < 0) item.style.transform = `translateX(${Math.max(currentX, -100)}px)`; else if (currentX > 0) item.style.transform = `translateX(${Math.min(currentX, 80)}px)`; };
                const endInteraction = () => { if (!isDragging) return; isDragging = false; clearTimeout(pressTimer); item.style.transition = 'transform 0.3s'; if (currentX < -50) { item.style.transform = 'translateX(-100%)'; setTimeout(() => { const id = parseInt(wrapper.dataset.id); deletedMessagesData.unshift(messagesData.find(m => m.id === id)); messagesData = messagesData.filter(msg => msg.id !== id); saveMessages(); saveDeletedMessages(); renderMessages(); }, 300); } else if (currentX > 40) { item.style.transform = 'translateX(0)'; const id = parseInt(wrapper.dataset.id); const msg = messagesData.find(m => m.id === id); msg.unread = msg.unread > 0 ? 0 : 1; saveMessages(); renderMessages(); if (navigator.vibrate) navigator.vibrate(10); } else { item.style.transform = 'translateX(0)'; } currentX = 0; };
                item.addEventListener('click', (e) => { if (hasLongPressed || hasMoved) { e.preventDefault(); e.stopPropagation(); return; } openChat(parseInt(wrapper.dataset.id)); });
                item.addEventListener('contextmenu', (e) => e.preventDefault());
                item.addEventListener('mousedown', (e) => startInteraction(e.clientX, e.clientY));
                item.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
                item.addEventListener('mouseup', endInteraction);
                item.addEventListener('mouseleave', () => { if(isDragging) endInteraction(); });
                item.addEventListener('touchstart', (e) => startInteraction(e.touches[0].clientX, e.touches[0].clientY), {passive: true});
                item.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY), {passive: true});
                item.addEventListener('touchend', endInteraction);
            });
        }

        const contextMenuOverlay = document.getElementById('contextMenuOverlay');
        document.getElementById('ctxCancel').addEventListener('click', () => contextMenuOverlay.classList.remove('active'));
        contextMenuOverlay.addEventListener('click', (e) => { if(e.target === contextMenuOverlay) contextMenuOverlay.classList.remove('active'); });
        document.getElementById('ctxMarkRead').addEventListener('click', () => { const msg = messagesData.find(m => m.id === contextMenuTargetId); msg.unread = msg.unread > 0 ? 0 : 1; saveMessages(); renderMessages(); contextMenuOverlay.classList.remove('active'); });
        document.getElementById('ctxPin').addEventListener('click', () => { const msg = messagesData.find(m => m.id === contextMenuTargetId); msg.pinned = !msg.pinned; saveMessages(); renderMessages(); contextMenuOverlay.classList.remove('active'); });
        document.getElementById('ctxDelete').addEventListener('click', () => { deletedMessagesData.unshift(messagesData.find(m => m.id === contextMenuTargetId)); messagesData = messagesData.filter(msg => msg.id !== contextMenuTargetId); saveMessages(); saveDeletedMessages(); renderMessages(); contextMenuOverlay.classList.remove('active'); });

        document.getElementById('newMessageBtn').addEventListener('click', () => document.getElementById('composeModal').classList.add('active'));
        document.getElementById('composeCancel').addEventListener('click', () => document.getElementById('composeModal').classList.remove('active'));
        document.getElementById('composeSend').addEventListener('click', () => {
            const sender = document.getElementById('composeSender').value.trim() || "Unknown";
            const text = document.getElementById('composeText').value.trim();
            if(!text) return;
            const time = getFormattedDate(new Date());
            let existing = messagesData.find(m => m.name === sender);
            if(existing) { 
                existing.unread++; existing.preview = text; existing.time = time; existing.isContactOnly = false; existing.history.push({ text, type: "received", time }); 
            } else {
                let isProvider = Object.keys(providerData).includes(sender);
                if (isProvider) {
                    messagesData.unshift({ id: Date.now(), name: sender, phone: "Unknown", color: providerData[sender].color, initial: providerData[sender].initial, time, preview: text, unread: 1, pinned: false, allowReply: false, isContactOnly: false, history: [{ text, type: "received", time }] });
                } else {
                    messagesData.unshift({ id: Date.now(), name: sender, phone: "Unknown", color: "bg-personal", initial: "", time, preview: text, unread: 1, pinned: false, allowReply: true, isContactOnly: false, history: [{ text, type: "received", time }] });
                }
            }
            saveMessages(); renderMessages();
            document.getElementById('composeModal').classList.remove('active');
            document.getElementById('composeSender').value = ""; document.getElementById('composeText').value = "";
        });

        const searchToggle = document.getElementById('searchToggle');
        const searchBar = document.getElementById('searchBar');
        const searchInput = document.getElementById('searchInput');
        searchToggle.addEventListener('click', () => searchBar.classList.toggle('active'));
        searchInput.addEventListener('input', (e) => { const val = e.target.value.toLowerCase(); const filtered = messagesData.filter(m => !m.isContactOnly && (m.name.toLowerCase().includes(val) || m.preview.toLowerCase().includes(val))); if(filtered.length === 0) { messagesList.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-secondary); font-size:13px;">No results</div>`; return; } messagesList.innerHTML = filtered.map(msg => { const av = msg.color === 'bg-personal' ? personIconSVG : msg.initial; return `<div class="message-item" onclick="openChat(${msg.id})" style="display:flex; padding:12px 16px; border-bottom:1px solid var(--border-color);"><div class="avatar ${msg.color}">${av}</div><div class="message-content"><div class="message-header"><div class="sender-name">${msg.name}</div><div class="timestamp">${msg.time}</div></div><div class="message-preview">${msg.preview}</div></div></div>`; }).join(''); });

        function renderContacts() {
            const contactsList = document.getElementById('contactsList');
            let html = '';
            if ('contacts' in navigator && navigator.contacts.select) { html += `<div style="padding: 12px 16px; text-align: center;"><button class="view-button" id="pickContactsBtn" style="padding: 6px 16px; font-size: 12px;">📒 Import from Phone</button></div>`; }
            if(messagesData.length === 0) { html += `<div style="text-align:center; padding:40px; color:var(--text-secondary); font-size:13px;">No contacts</div>`; }
            else { messagesData.sort((a, b) => a.name.localeCompare(b.name)); messagesData.forEach(msg => { const av = msg.color === 'bg-personal' ? personIconSVG : msg.initial; html += `<div class="contact-item" onclick="openChat(${msg.id})"><div class="avatar ${msg.color}">${av}</div><div class="contact-info"><div class="contact-name">${msg.name}</div><div class="contact-phone">${msg.phone}</div></div></div>`; }); }
            contactsList.innerHTML = html;
            const pickBtn = document.getElementById('pickContactsBtn');
            if (pickBtn) pickBtn.addEventListener('click', pickContacts);
        }
        async function pickContacts() {
            try { const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true }); if (contacts.length === 0) return; contacts.forEach(c => { const name = c.name ? c.name[0] : "Unknown"; const tel = c.tel ? c.tel[0] : "No Number"; let existing = messagesData.find(m => m.name === name && m.phone === tel); if (!existing) messagesData.unshift({ id: Date.now() + Math.random(), name, phone: tel, color: "bg-personal", initial: "", time: "Just now", preview: "Tap to start chatting...", unread: 0, pinned: false, allowReply: true, isContactOnly: true, history: [] }); }); saveMessages(); renderContacts(); } catch (err) {}
        }

        function openChat(id) {
            const msg = messagesData.find(m => m.id === id);
            activeChatId = id;
            document.getElementById('chatTitle').textContent = msg.name;
            const av = msg.color === 'bg-personal' ? personIconSVG : msg.initial;
            document.getElementById('chatAvatar').innerHTML = av;
            document.getElementById('chatAvatar').className = `chat-avatar ${msg.color}`;
            document.getElementById('chatInputArea').style.display = (msg.allowReply === false) ? 'none' : 'flex';
            if(msg.unread > 0) { msg.unread = 0; saveMessages(); }
            const chatBody = document.getElementById('chatBody');
            chatBody.innerHTML = `<div style="text-align:center; color:var(--text-secondary); font-size:10px; margin-bottom:8px;">Today</div>`;
            
            if (msg.history.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'chat-bubble received';
                emptyDiv.style.cssText = 'background:transparent; border:none; align-self:center; color:var(--text-secondary); font-size:12px;';
                emptyDiv.textContent = `This is the beginning of your conversation with ${msg.name}.`;
                chatBody.appendChild(emptyDiv);
            } else {
                msg.history.forEach(h => {
                    const bubble = document.createElement('div');
                    bubble.className = `chat-bubble ${h.type}`;
                    bubble.innerHTML = `${h.text}<div class="chat-meta"><span>${h.time}</span>${h.type === 'sent' ? ' ✓✓' : ''}</div>`;
                    chatBody.appendChild(bubble);
                });
            }
            chatView.classList.add('active');
            requestAnimationFrame(() => { chatBody.scrollTop = chatBody.scrollHeight; });
        }

        function deleteCurrentChat() {
            if (activeChatId === null) return;
            contextMenuOverlay.classList.add('active');
            document.getElementById('contextMenu').innerHTML = `<div class="context-item danger" onclick="confirmDeleteChat()">Delete Conversation</div><div class="context-item cancel" onclick="cancelDeleteChat()">Cancel</div>`;
        }
        function cancelDeleteChat() { contextMenuOverlay.classList.remove('active'); document.getElementById('contextMenu').innerHTML = `<div class="context-item" id="ctxMarkRead">Mark as Read</div><div class="context-item" id="ctxPin">Pin to Top</div><div class="context-item danger" id="ctxDelete">Delete</div><div class="context-item cancel" id="ctxCancel">Cancel</div>`; document.getElementById('ctxCancel').addEventListener('click', () => contextMenuOverlay.classList.remove('active')); }
        function confirmDeleteChat() { contextMenuOverlay.classList.remove('active'); deletedMessagesData.unshift(messagesData.find(m => m.id === activeChatId)); messagesData = messagesData.filter(msg => msg.id !== activeChatId); saveMessages(); chatView.classList.remove('active'); activeChatId = null; renderMessages(); renderContacts(); if (navigator.vibrate) navigator.vibrate(20); }

        document.getElementById('sendBtn').addEventListener('click', () => {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text || activeChatId === null) return;
            const msg = messagesData.find(m => m.id === activeChatId);
            if (!msg) return;
            const time = getFormattedDate(new Date());
            msg.isContactOnly = false; // Move to messages list
            msg.history.push({ text, type: "sent", time });
            msg.preview = text; msg.time = "Just now"; saveMessages();
            const chatBody = document.getElementById('chatBody');
            const sentBubble = document.createElement('div');
            sentBubble.className = 'chat-bubble sent';
            sentBubble.innerHTML = `${text}<div class="chat-meta"><span>${time}</span> ✓</div>`;
            chatBody.appendChild(sentBubble);
            input.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;
            const typingBubble = document.createElement('div');
            typingBubble.className = 'typing-indicator';
            typingBubble.innerHTML = '<span></span><span></span><span></span>';
            setTimeout(() => { chatBody.appendChild(typingBubble); chatBody.scrollTop = chatBody.scrollHeight; }, 500);
            setTimeout(() => {
                typingBubble.remove();
                const replyText = "Got it! Thanks for your message."; const replyTime = getFormattedDate(new Date());
                msg.history.push({ text: replyText, type: "received", time: replyTime }); saveMessages();
                const replyBubble = document.createElement('div');
                replyBubble.className = 'chat-bubble received';
                replyBubble.innerHTML = `${replyText}<div class="chat-meta"><span>${replyTime}</span></div>`;
                chatBody.appendChild(replyBubble);
                chatBody.scrollTop = chatBody.scrollHeight;
            }, 1500);
        });

        document.getElementById('backBtn').addEventListener('click', () => { chatView.classList.remove('active'); activeChatId = null; renderMessages(); renderContacts(); });
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                if(this.dataset.view === 'contacts') { document.body.classList.add('contacts-active'); document.getElementById('viewTitle').textContent = "Contacts"; renderContacts(); }
                else { document.body.classList.remove('contacts-active'); document.getElementById('viewTitle').textContent = "Messages"; renderMessages(); }
                searchBar.classList.remove('active'); searchInput.value = "";
            });
        });

        let deferredPrompt; const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; if(installBtn) installBtn.style.display = 'flex'; });
        if(installBtn) { installBtn.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; installBtn.style.display = 'none'; } }); }
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').then(reg => { reg.addEventListener('updatefound', () => { const nw = reg.installing; nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) window.location.reload(); }); }); }); }); }

        renderMessages(); renderContacts();
    </script>
</body>
</html>
