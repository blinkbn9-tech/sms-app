<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro SMS App</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Messages">
    <meta name="theme-color" content="#007AFF">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" type="image/png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="notification-banner" id="notificationBanner">
            <div class="notif-avatar bg-teal">N</div>
            <div class="notif-content">
                <div class="notif-title">New Sender</div>
                <div class="notif-text">Hey! This is a newly...</div>
            </div>
        </div>

        <div class="main-view" id="mainView">
            <div class="header">
                <div class="header-content">
                    <div class="header-title" id="viewTitle">Messages</div>
                    <div class="header-actions">
                        <i class="fas fa-search search-icon" id="searchToggle"></i>
                        <i class="fas fa-moon dark-mode-icon" id="darkModeToggle"></i>
                    </div>
                </div>
                
                <div class="search-bar" id="searchBar">
                    <input type="text" id="searchInput" placeholder="Search messages...">
                </div>

                <div class="unread-banner">
                    <div class="unread-text">
                        <span class="unread-count" id="totalUnread">0</span> unread messages
                    </div>
                    <button class="view-button" id="viewUnreadBtn">View</button>
                </div>
            </div>

            <div class="messages-container" id="messagesList"></div>
            <div class="contacts-container" id="contactsList"></div>

            <div class="fab" id="newMessageBtn">
                <i class="fas fa-pen-to-square"></i>
            </div>
            
            <!-- PWA Install Button -->
            <div class="install-fab" id="installBtn" style="display: none;">
                <i class="fas fa-download"></i>
            </div>

            <div class="bottom-nav">
                <div class="nav-item active" data-view="messages">
                    <i class="fas fa-comment nav-icon"></i>
                    <span class="nav-label">Conversations</span>
                </div>
                <div class="nav-item" data-view="contacts">
                    <i class="fas fa-address-book nav-icon"></i>
                    <span class="nav-label">Contacts</span>
                </div>
                <div class="nav-badge" id="navBadge" style="display: none;">0</div>
            </div>
        </div>

        <div class="chat-view" id="chatView">
            <div class="chat-header">
                <i class="fas fa-arrow-left back-btn" id="backBtn"></i>
                <div class="chat-avatar" id="chatAvatar"></div>
                <div class="chat-title" id="chatTitle"></div>
                <i class="fas fa-ellipsis-v chat-menu" id="chatMenuBtn"></i>
                <i  class="fas fa-trash chat-delete" id="chatDeleteBtn"></i>
            </div>
            <div class="chat-body" id="chatBody"></div>
            <div class="chat-input-area">
                <i class="fas fa-plus"></i>
                <input type="text" id="messageInput" placeholder="Text Message">
                <i class="fas fa-paper-plane send-btn" id="sendBtn"></i>
            </div>
        </div>

        <div class="modal-overlay" id="composeModal">
            <div class="compose-sheet">
                <div class="compose-header">
                    <span class="compose-cancel" id="composeCancel">Cancel</span>
                    <span class="compose-title">New Message</span>
                    <span class="compose-send" id="composeSend">Send</span>
                </div>
                <div class="compose-body">
                    <input type="text" id="composeSender" placeholder="Sender Name (e.g., MPESA)">
                    <textarea id="composeText" placeholder="Message content..."></textarea>
                </div>
            </div>
        </div>

        <div class="context-menu-overlay" id="contextMenuOverlay">
            <div class="context-menu" id="contextMenu">
                <div class="context-item" id="ctxMarkRead">Mark as Read</div>
                <div class="context-item" id="ctxPin">Pin to Top</div>
                <div class="context-item danger" id="ctxDelete">Delete</div>
                <div class="context-item cancel" id="ctxCancel">Cancel</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        console.log('SW Registered!');
                        // Listen for updates
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                // When the new SW is installed, force the page to reload!
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    window.location.reload();
                                }
                            });
                        });
                    })
                    .catch(err => console.error('SW Failed:', err));
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if(installBtn) installBtn.style.display = 'flex';
        });
        if(installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    installBtn.style.display = 'none';
                    deferredPrompt = null;
                }
            });
        }
    </script>
</body>
</html>
